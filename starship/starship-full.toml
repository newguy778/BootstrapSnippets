# ~/.config/zsh/starship.toml
#
# Starship port of the previous Powerlevel10k setup (lean, single line, no
# separators, transparent background, nerdfont-v3 icons).
# Loaded through ~/.config/zsh/prompt.zsh, which exports STARSHIP_CONFIG to this
# file. Colors are the exact 256-color indexes the p10k config used, so the look
# on Catppuccin Mocha / Alacritty stays identical.
#
# p10k originals:
#   LEFT  = os_icon, dir, vcs, prompt_char
#   RIGHT = status, command_execution_time, background_jobs, ... kubecontext,
#           terraform, aws, ... (only the first four are wired up here)
#   no add-newline, no segment separators/backgrounds, 1 space between segments

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false            # p10k: POWERLEVEL9K_PROMPT_ADD_NEWLINE=false
command_timeout = 500
scan_timeout = 30

format = "$directory$git_branch$git_commit$git_state$git_status$character"
right_format = "$status$cmd_duration$jobs$kubernetes"

palette = "p10k"

[palettes.p10k]
dir        = "31"    # POWERLEVEL9K_DIR_FOREGROUND
anchor     = "39"    # POWERLEVEL9K_DIR_ANCHOR_FOREGROUND (was bold)
clean      = "76"    # VCS clean / branch
modified   = "178"   # VCS staged+unstaged / dirty
untracked  = "39"    # VCS untracked
conflicted = "196"   # VCS conflicted
meta       = "244"   # VCS loading
error      = "160"   # POWERLEVEL9K_STATUS_ERROR_FOREGROUND
time       = "101"   # POWERLEVEL9K_COMMAND_EXECUTION_TIME_FOREGROUND
jobs       = "70"    # POWERLEVEL9K_BACKGROUND_JOBS_FOREGROUND
kube       = "134"   # POWERLEVEL9K_KUBECONTEXT_DEFAULT_FOREGROUND

# ─── left: os icon (removed 2026-11-18, p10k parity dropped) ──────────────────
# To get the Apple logo back, add this and put $os at the front of the format:
#   [os]
#   disabled = false
#   format = "$symbol "
#   style = "none"
#   [os.symbols]
#   Macos = ""

# ─── left: directory ──────────────────────────────────────────────────────────
# Path only: no house/folder glyphs (removed 2026-11-18). p10k drew the path
# components in bold anchor-39 with "/" separators in 31; starship styles the
# whole $path at once, so this keeps the dominant look. The read-only lock is
# still shown (p10k DIR_SHOW_WRITABLE=v3). Paths longer than 4 components are cut
# to the last 4 with a "…/" prefix; shorter paths print in full.
[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold anchor"
truncation_length = 4          # p10k DIR_MAX_LENGTH=80 approximation; 0 = never truncate
truncate_to_repo = false
use_os_path_sep = true
truncation_symbol = "…/"
read_only = " "            # p10k LOCK_ICON U+F023
read_only_style = "dir"

# ─── left: git ────────────────────────────────────────────────────────────────
[git_branch]
format = " [$symbol$branch]($style)"
symbol = " "                 # p10k VCS_BRANCH_ICON U+F126 + space
style = "clean"
truncation_length = 32         # p10k: branch > 32 chars -> "…"
truncation_symbol = "…"

# Detached HEAD: git_branch prints "HEAD", so show the short hash (only_detached is the default).
[git_commit]
format = ' [\($hash\)]($style)'
style = "meta"
only_detached = true

# Mid-rebase / merge / cherry-pick / revert / bisect, with step counts where git reports them.
[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\)'
style = "modified"

[git_status]
# $ahead_behind is the format variable. ahead/behind/diverged below are only its strings.
# renamed and deleted were configured but missing from the old format, so they never rendered.
format = '[$conflicted](conflicted)[$stashed](clean)[$staged](modified)[$modified](modified)[$renamed](modified)[$deleted](modified)[$untracked](untracked)[$ahead_behind](clean)'

conflicted = " ~${count}"      # p10k: ~n
stashed = " *${count}"         # p10k: *n
staged = " +${count}"          # p10k: +n
modified = " !${count}"        # p10k: !n
deleted = " ✘${count}"
renamed = " »${count}"
untracked = " ?${count}"       # p10k VCS_UNTRACKED_ICON='?'
ahead = " ⇡${count}"           # p10k: ⇡n
behind = " ⇣${count}"          # p10k: ⇣n
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

# ─── left: prompt character ───────────────────────────────────────────────────
[character]
format = " $symbol "           # p10k PROMPT_CHAR_*_CONTENT_EXPANSION
success_symbol = "[❯](fg:76)"
error_symbol = "[❯](fg:196)"   # p10k ERROR foreground
vimcmd_symbol = "[❮](fg:76)"
vimcmd_replace_one_symbol = "[❮](fg:76)"
vimcmd_replace_symbol = "[❮](fg:76)"
vimcmd_visual_symbol = "[V](fg:76)"

# ─── right: exit status (only on failure) ─────────────────────────────────────
[status]
disabled = false
format = "[ ${symbol}${status}]($style)"
symbol = "✘"                   # p10k STATUS_ERROR_VISUAL_IDENTIFIER
style = "error"
# p10k STATUS_OK=false / STATUS_OK_PIPE=true: success is silent here too.

# ─── right: command duration (>3s) ────────────────────────────────────────────
[cmd_duration]
min_time = 3000                # p10k COMMAND_EXECUTION_TIME_THRESHOLD=3
format = "[ ${duration}]($style)"
style = "time"
show_milliseconds = false      # p10k PRECISION=0

# ─── right: background jobs ───────────────────────────────────────────────────
[jobs]
symbol = ""
format = "[ ${symbol}${number}]($style)"
style = "jobs"
number_threshold = 1
symbol_threshold = 1

# ─── right: kubernetes context ────────────────────────────────────────────────
# p10k only showed this after kubectl/helm/kubectx/kubens/... commands
# (POWERLEVEL9K_KUBECONTEXT_SHOW_ON_COMMAND). Starship cannot gate on the
# command, so this approximates it: shown only in directories that contain k8s
# files. Set disabled = true to hide it entirely.
[kubernetes]
disabled = false
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml"]
detect_folders = ["k8s", "kubernetes", "charts"]
symbol = "⎈ "              # p10k used U+F10FE; not present in every Nerd Font
format = "[ ${symbol}${context}( ${namespace})]($style)"
style = "kube"

# ─── right: not ported (kept off to stay visually identical) ──────────────────
# terraform, aws, azure, gcloud, node/python/go/rust version, context (user@host)
# p10k had these in RIGHT_PROMPT_ELEMENTS but they are silent by default;
# re-enable any of them by adding e.g. $nodejs / $aws to right_format.
